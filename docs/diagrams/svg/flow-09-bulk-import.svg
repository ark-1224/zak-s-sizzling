<polygon points="405.0,1078.0 503.0,1118.0 405.0,1158.0 307.0,1118.0" fill="#ffffff" stroke="#222222" stroke-width="1.6"/>
<text x="405.0" y="1115.14" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#222222">Any row with an</text>
<text x="405.0" y="1129.14" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#222222">error?</text>
<polygon points="71.0,1093.0 253.0,1093.0 239.0,1143.0 57.0,1143.0" fill="#ffffff" stroke="#222222" stroke-width="1.6"/>
<text x="155.0" y="1115.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" fill="#222222">Fix the rows in the box</text>
<text x="155.0" y="1130.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" fill="#222222">or in the file</text>
