<rect x="307.0" y="1317.0" width="196" height="50" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.6"/>
<text x="405.0" y="1339.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" fill="#222222">Send the rows (POST</text>
<text x="405.0" y="1354.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" fill="#222222">/api/products/bulk-import)</text>
<rect x="557.0" y="1309.5" width="196" height="65" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.6"/>
<text x="655.0" y="1331.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" fill="#222222">Import each row: update</text>
<text x="655.0" y="1346.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" fill="#222222">the product with that</text>
<text x="655.0" y="1361.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" fill="#222222">barcode, or create one</text>
<polygon points="321.0,1414.0 503.0,1414.0 489.0,1494.0 307.0,1494.0" fill="#ffffff" stroke="#222222" stroke-width="1.6"/>
<text x="405.0" y="1436.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" fill="#222222">Show the result:</text>
<text x="405.0" y="1451.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" fill="#222222">created, updated,</text>
<text x="405.0" y="1466.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" fill="#222222">errors; the button</text>
<text x="405.0" y="1481.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" fill="#222222">reads Imported (16b)</text>
<rect x="57.0" y="1545.0" width="196" height="42" rx="21.0" fill="#e9e9e9" stroke="#222222" stroke-width="1.6"/>
