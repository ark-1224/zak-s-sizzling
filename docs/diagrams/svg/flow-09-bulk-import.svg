<polygon points="71.0,301.5 253.0,301.5 239.0,366.5 57.0,366.5" fill="#ffffff" stroke="#222222" stroke-width="1.6"/>
<text x="155.0" y="323.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" fill="#222222">Choose or drop a .csv</text>
<text x="155.0" y="338.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" fill="#222222">or .xlsx file, or paste</text>
<text x="155.0" y="353.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" fill="#222222">CSV into the box</text>
<polygon points="405.0,400.0 503.0,446.0 405.0,492.0 307.0,446.0" fill="#ffffff" stroke="#222222" stroke-width="1.6"/>
<text x="405.0" y="436.14" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#222222">An old .xls, or</text>
<text x="405.0" y="450.14" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#222222">an .xlsx over 2</text>
<text x="405.0" y="464.14" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" text-anchor="middle" fill="#222222">MB?</text>
<polygon points="405.0,518.0 503.0,558.0 405.0,598.0 307.0,558.0" fill="#ffffff" stroke="#222222" stroke-width="1.6"/>
