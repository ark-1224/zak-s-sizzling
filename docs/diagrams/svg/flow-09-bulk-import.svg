<polygon points="363.52,1680 385.52,1693.0 363.52,1706 341.52,1693.0" fill="#ffffff" stroke="#222222" stroke-width="1.4"/>
<text x="393.52" y="1697" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555555">Decision</text>
<polygon points="483.44,1680 519.44,1680 511.44000000000005,1706 475.44,1706" fill="#ffffff" stroke="#222222" stroke-width="1.4"/>
<text x="527.44" y="1697" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555555">Input / output</text>
<rect x="30" y="1718" width="44" height="26" fill="#ffffff" stroke="#222222" stroke-width="1.4"/>
<line x1="36" y1="1718" x2="36" y2="1744" stroke="#222222"/><line x1="68" y1="1718" x2="68" y2="1744" stroke="#222222"/>
<text x="82" y="1735" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555555">Shown in another diagram</text>
<rect x="263.76" y="1718" width="44" height="26" fill="#ffffff" stroke="#222222" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="315.76" y="1735" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555555">Partial in the code</text>
<text x="30" y="1782" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#222222">Notes</text>
<text x="30" y="1802" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555" xml:space="preserve">• Row checks: name required (150 characters at most), category must match an existing one, price required and 0 or</text>
<text x="30" y="1819" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555" xml:space="preserve">   more, cost 0 or more if given, stock and minimum whole numbers of 0 or more, barcode 64 characters at most.</text>
<text x="30" y="1836" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555" xml:space="preserve">• Rows are imported one by one, not all-or-nothing: a row that fails at import time is listed as an error while</text>
<text x="30" y="1853" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555" xml:space="preserve">   the others are saved.</text>
<text x="30" y="1870" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555" xml:space="preserve">• The template can be downloaded as .xlsx (with a category list) or .csv.</text>
</svg>
