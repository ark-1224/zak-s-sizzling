<text x="655.0" y="1354.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" fill="#222222">dishes already on the menu</text>
<text x="655.0" y="1369.0" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" fill="#222222">replace their recipe</text>
<polygon points="321.0,1406.5 503.0,1406.5 489.0,1501.5 307.0,1501.5" fill="#ffffff" stroke="#222222" stroke-width="1.6"/>
<text x="405.0" y="1428.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" fill="#222222">Show the result:</text>
<text x="405.0" y="1443.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" fill="#222222">created, updated,</text>
<text x="405.0" y="1458.5" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="middle" fill="#222222">recipes set, errors;</text>
