<text x="82" y="1697" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555555">Start / end</text>
<rect x="182.64" y="1680" width="44" height="26" rx="3" fill="#ffffff" stroke="#222222" stroke-width="1.4"/>
<text x="234.64" y="1697" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555555">Process step</text>
<polygon points="363.52,1680 385.52,1693.0 363.52,1706 341.52,1693.0" fill="#ffffff" stroke="#222222" stroke-width="1.4"/>
<text x="393.52" y="1697" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555555">Decision</text>
<polygon points="483.44,1680 519.44,1680 511.44000000000005,1706 475.44,1706" fill="#ffffff" stroke="#222222" stroke-width="1.4"/>
<text x="527.44" y="1697" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555555">Input / output</text>
<rect x="30" y="1718" width="44" height="26" fill="#ffffff" stroke="#222222" stroke-width="1.4"/>
<line x1="36" y1="1718" x2="36" y2="1744" stroke="#222222"/><line x1="68" y1="1718" x2="68" y2="1744" stroke="#222222"/>
<text x="82" y="1735" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555555">Shown in another diagram</text>
<rect x="263.76" y="1718" width="44" height="26" fill="#ffffff" stroke="#222222" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="315.76" y="1735" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555555">Partial in the code</text>
<text x="30" y="1782" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#222222">Notes</text>
<text x="30" y="1802" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555" xml:space="preserve">• Products rows: name required (150 characters at most), category must match an existing one, price required and 0</text>
<text x="30" y="1819" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555" xml:space="preserve">   or more, cost 0 or more if given. Recipes rows: the dish must be in Products or on the menu, the raw material</text>
<text x="30" y="1836" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555" xml:space="preserve">   must exist, the amount must be above 0, each raw material once per dish.</text>
<text x="30" y="1853" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555" xml:space="preserve">• A new dish needs its recipe rows; a dish with a bad recipe row isn&#x27;t saved at all rather than with half a</text>
<text x="30" y="1870" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555" xml:space="preserve">   recipe; items in the Ready-made category take no recipe. Dishes are imported one by one: one that fails at</text>
<text x="30" y="1887" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555" xml:space="preserve">   import time is listed as an error while the others are saved.</text>
<text x="30" y="1904" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555" xml:space="preserve">• Templates: an .xlsx with both sheets and lists of categories and raw materials, or a .csv for each table.</text>
</svg>
