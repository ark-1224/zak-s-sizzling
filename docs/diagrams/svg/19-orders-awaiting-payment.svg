<text x="24" y="32" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#222222">19  Orders awaiting payment: Queue (cancelling some dishes)</text>
<text x="24" y="54" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555">Route: /staff/orders   ·   Screen: 1280 px wide desktop browser   ·   Access: Admin and Staff (admin site, signed in)</text>
<text x="24" y="73" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555">Code: apps/web/src/app/staff/orders/page.tsx, apps/web/src/components/staff/CancelDishes.tsx, apps/web/src/components/admin/AdminShell.tsx</text>
<text x="24" y="1122" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#222222">Notes</text>
<text x="24" y="1142" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">• The counter&#x27;s light point of sale (panel feedback), in three tabs kept in the address: Queue, New order (19e, ?tab=new) and Paid orders (19f, ?tab=paid). The Queue lists unpaid,</text>
<text x="24" y="1161" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">   not-cancelled orders plus orders flagged for attention (newest first, up to 50); search ignores spaces and dashes; a walk-in order rung up on New order is tagged WALK-IN.</text>
<text x="24" y="1180" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">• Take payment opens the payment step (19c); paying shows the receipt (19d). Taking payment checks the stock, deducts it and sends the order to the kitchen in one step; if stock is short</text>
<text x="24" y="1199" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">   nothing changes and staff are told to hand the money back and take that dish off.</text>
<text x="24" y="1218" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">• Cancel order (second row) asks which dishes to cancel: every dish starts ticked, staff untick what the customer keeps and set how many of a dish (− / +). Some dishes: they come off the</text>
<text x="24" y="1237" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">   order and the total, and the payment waiting for it, goes down (POST /api/orders/:id/cancel-items). Every dish left: the order is cancelled and leaves the Queue. Refused for an order</text>
<text x="24" y="1256" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">   being paid by QR Ph, whose code was made for its total.</text>
<text x="24" y="1275" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">• NEEDS ATTENTION marks an order staff must sort out, with the note on what happened and what to do: paid online after the stock ran out or after the order was cancelled, a wrong amount,</text>
<text x="24" y="1294" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">   paid twice, or a paid order cancelled from Paid orders (third row). Refunded: mark as sorted out records the payment as refunded; the note stays in Transactions (23).</text>
