<text x="24" y="32" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#222222">19  Orders awaiting payment</text>
<text x="24" y="54" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555">Route: /staff/orders   ·   Screen: 1280 px wide desktop browser   ·   Access: Admin and Staff (admin site, signed in)</text>
<text x="24" y="73" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555">Code: apps/web/src/app/staff/orders/page.tsx, apps/web/src/components/admin/AdminShell.tsx</text>
<text x="24" y="1022" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#222222">Notes</text>
<text x="24" y="1042" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">• Lists unpaid, not-cancelled orders plus orders flagged for attention (newest first, up to 50). Search ignores spaces and dashes. The order type, payment method and how long ago it was</text>
<text x="24" y="1061" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">   placed come from the order.</text>
<text x="24" y="1080" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">• Live: the list reloads by itself (orders:changed, an event with no order data) whenever an order is placed, paid, edited or cancelled; an order that arrives while the page is open is</text>
<text x="24" y="1099" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">   marked NEW for a minute (first row).</text>
<text x="24" y="1118" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">• Confirm order (“Checking stock…”) marks it paid, deducts stock and sends it to the kitchen in one step; if stock is short nothing changes and an error tells staff to change the order</text>
<text x="24" y="1137" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">   with the customer. Cancel asks first (second row).</text>
<text x="24" y="1156" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">• NEEDS ATTENTION (third row) marks an online payment staff must sort out, with the server&#x27;s note on what happened and what to do: paid after the stock ran out or after the order was</text>
<text x="24" y="1175" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">   cancelled, a wrong amount, or paid twice. Once staff have refunded, substituted or collected the difference, Mark as sorted out takes it off the list (the note stays in the transaction</text>
<text x="24" y="1194" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">   history); an unpaid one also keeps Cancel and Confirm. PARTIAL: this only arises with online payment.</text>
