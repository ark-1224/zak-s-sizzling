<text x="280" y="36" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#8a8a8a">BILLING &amp; PAYMENT</text>
<text x="280" y="70" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#222222">Orders awaiting payment</text>
<text x="280" y="94" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#555555">Counter orders show up here as soon as they are placed; the list updates by itself. Confirm, then collect payment: confirming checks the stock</text>
<text x="280" y="111.55" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#555555">first, so if something has run out you can change the order before the customer pays. Cancel an order the customer never came back to pay for.</text>
<text x="280" y="151.1" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#222222">ZK-XXXXXX confirmed and sent to the kitchen. Collect ₱000.00 from the customer. Tell the customer it will be ready at about 12:45 PM.</text>
