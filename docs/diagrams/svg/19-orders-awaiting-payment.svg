<text x="280" y="158" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#555555">Counter orders show up here as soon as they are placed; the list updates by itself. Take payment checks the stock first, so if something has run</text>
