<text x="24" y="73" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555">Code: apps/web/src/app/admin/kiosk-qr/page.tsx, apps/web/src/components/admin/AdminShell.tsx</text>
<text x="24" y="1122" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#222222">Notes</text>
<text x="24" y="1142" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">• The address starts as the kiosk site&#x27;s address (NEXT_PUBLIC_KIOSK_URL, else this site) and is remembered on this device; Use this site resets it. The QR code is made in the browser;</text>
<text x="24" y="1161" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">   nothing is sent to an outside service.</text>
<text x="24" y="1180" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">• Print poster prints only the poster on A4; Download PNG saves the code as zaks-kiosk-qr.png. Step 3 mentions GCash and Maya, which aren&#x27;t set up in production yet.</text>
