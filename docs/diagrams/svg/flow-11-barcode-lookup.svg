<text x="30" y="1690" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555" xml:space="preserve">• “Adjust its stock? No” goes back to scanning the next item. A scanner types the code and presses Enter; a scan</text>
<text x="30" y="1707" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555" xml:space="preserve">   is caught even when the field isn&#x27;t focused. The last 5 codes stay listed and can be looked up again with one</text>
<text x="30" y="1724" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555" xml:space="preserve">   tap.</text>
<text x="30" y="1741" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555" xml:space="preserve">• For a recipe dish the result shows the servings left and a Raw materials button instead of Adjust stock. The</text>
<text x="30" y="1758" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555" xml:space="preserve">   shown stock updates live.</text>
