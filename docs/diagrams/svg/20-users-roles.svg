<text x="24" y="54" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555">Route: /admin/users   ·   Screen: 1280 px wide desktop browser   ·   Access: Admin only (admin site, signed in)</text>
<text x="24" y="73" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555">Code: apps/web/src/app/admin/users/page.tsx, apps/web/src/components/admin/AdminShell.tsx</text>
<text x="24" y="1022" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#222222">Notes</text>
<text x="24" y="1042" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">• The signed-in admin&#x27;s own row (YOU) has its role and Suspend disabled: “You can&#x27;t suspend your own account or change its role. Another admin can.” The API refuses it too.</text>
<text x="24" y="1061" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">• Changing a role or suspending asks first (20c); Reactivate happens straight away. A suspended user can&#x27;t sign in and loses access within 15 minutes. + Invite user opens 20b.</text>
