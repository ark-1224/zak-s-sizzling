<text x="30" y="1505" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#222222">Notes</text>
<text x="30" y="1525" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555" xml:space="preserve">• Each double-edged box is drawn step by step in the flow it names.</text>
<text x="30" y="1542" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555" xml:space="preserve">• An Admin can also do everything in the Staff lane (role checks in apps/api/src/middleware/authorize.ts).</text>
<text x="30" y="1559" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555" xml:space="preserve">• The worker also runs on its own clock: every hour it logs the items at or below their minimum, and every night at 2:00 AM (Manila) it backs up the database to cloud storage. Low-stock</text>
<text x="30" y="1576" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555" xml:space="preserve">   emails run only when email is set up, and the backup only when cloud storage is set up (apps/worker/src/index.ts).</text>
</svg>
