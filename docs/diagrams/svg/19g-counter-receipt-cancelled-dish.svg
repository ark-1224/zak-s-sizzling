<text x="24" y="54" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555">Route: /staff/orders?tab=paid  (popup)   ·   Screen: 1280 px wide desktop browser   ·   Access: Admin and Staff (admin site, signed in)</text>
<text x="24" y="73" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555">Code: apps/web/src/components/staff/CounterReceipt.tsx, apps/web/src/lib/receiptPrinter.ts, apps/web/src/components/admin/AdminShell.tsx</text>
<text x="24" y="1122" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#222222">Notes</text>
<text x="24" y="1142" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">• The receipt of a paid order some of whose dishes were cancelled (Receipt on Paid orders, 19f): the cancelled dish is struck through, Charged is what the customer paid, Cancelled dishes</text>
<text x="24" y="1161" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">   (refund) what is owed back, and TOTAL what is left. The change is worked out from what was charged.</text>
<text x="24" y="1180" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">• Printed on the counter&#x27;s receipt printer (?printer=1): the slip shows “Cancelled (refund) -35.00” above the total, then the cash received and the change. Dishes cancelled whole aren&#x27;t</text>
<text x="24" y="1199" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">   printed.</text>
