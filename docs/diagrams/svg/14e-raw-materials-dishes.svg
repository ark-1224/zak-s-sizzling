<text x="24" y="32" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#222222">14e  Raw materials: Dishes (servings)</text>
<text x="24" y="54" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555">Route: /admin/raw-materials?tab=dishes   ·   Screen: 1280 px wide desktop browser   ·   Access: Admin and Staff (admin site, signed in)</text>
<text x="24" y="73" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555">Code: apps/web/src/app/admin/raw-materials/page.tsx (DishServings), apps/web/src/components/admin/AdminShell.tsx</text>
<text x="24" y="1022" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#222222">Notes</text>
<text x="24" y="1042" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">• Each dish&#x27;s servings: for every raw material in its recipe, the stock divided by the amount one serving uses, and the smallest of those; the raw material that runs out first is the one</text>
<text x="24" y="1061" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">   that limits it. Lowest first. Built from the raw materials&#x27; “used in” lists, so Staff see it too (recipes themselves are admin-only).</text>
<text x="24" y="1080" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">• A dish without a recipe shows NO RECIPE (sold out on the kiosk) with “Add its recipe in Products” for an Admin, or “Ask an administrator to add its recipe” for Staff. Ready-made items</text>
<text x="24" y="1099" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">   are on their own tab.</text>
