<text x="24" y="32" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#222222">19d  Counter receipt (popup)</text>
<text x="24" y="54" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555">Route: /staff/orders  (popup)   ·   Screen: 1280 px wide desktop browser   ·   Access: Admin and Staff (admin site, signed in)</text>
<text x="24" y="73" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555">Code: apps/web/src/components/staff/CounterReceipt.tsx, apps/web/src/lib/receiptPrinter.ts, apps/web/src/components/admin/AdminShell.tsx</text>
<rect x="957.37" y="12" width="346.63" height="28" rx="14" fill="#222222"/>
<text x="1130.685" y="31" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">STAFF  ·  the Administrator can open it too</text>
<text x="24" y="1122" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#222222">Notes</text>
<text x="24" y="1142" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">• Shown after a payment is taken (and from Receipt on Paid orders, 19f). Items with their instructions, the total, how it was paid, the cash received and change (cash) or the reference</text>
<text x="24" y="1161" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">   number (GCash, Maya), and the ready time.</text>
<text x="24" y="1180" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">• Print receipt prints on the counter&#x27;s thermal receipt printer (58 mm, through print-service/ on the counter computer) once Orders awaiting payment has been opened there with ?printer=1:</text>
<text x="24" y="1199" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">   the dishes, total, “PAID - Cash” with the cash received and change, or “PAID - GCash / Maya” with the reference number. It then says “Printed on the receipt printer.”; if the printer</text>
<text x="24" y="1218" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">   doesn&#x27;t answer, it says so and offers Try again and Print with this computer.</text>
<text x="24" y="1237" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">• Without ?printer=1 (any other computer), Print receipt prints only the receipt (a 72 mm-wide page) through the computer&#x27;s own printer and the browser&#x27;s print dialog.</text>
