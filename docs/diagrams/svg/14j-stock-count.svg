<text x="24" y="54" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555">Route: /admin/raw-materials?tab=count   ·   Screen: 1280 px wide desktop browser   ·   Access: Admin and Staff (admin site, signed in)</text>
<text x="24" y="73" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555">Code: apps/web/src/components/admin/StockCountTab.tsx, apps/web/src/app/admin/raw-materials/page.tsx, apps/web/src/components/admin/AdminShell.tsx</text>
<rect x="957.37" y="12" width="346.63" height="28" rx="14" fill="#222222"/>
<text x="1130.685" y="31" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">STAFF  ·  the Administrator can open it too</text>
<text x="24" y="1022" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#222222">Notes</text>
<text x="24" y="1042" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">• The count sheet, done before each market trip (about every two weeks): Staff and the Administrator type what&#x27;s actually there for each raw material and ready-made item (whole pieces for</text>
<text x="24" y="1061" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">   ready-made). The system&#x27;s figure is hidden while counting, so it doesn&#x27;t sway the count.</text>
<text x="24" y="1080" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">• Save count asks first, then sets each counted item&#x27;s stock to the count (a correction in Stock movements, “Stock count”) and records the expected figure: POST /api/inventory/counts. The</text>
<text x="24" y="1099" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">   variance shows next (14k). Past counts are listed below the sheet with Variance to open one.</text>
