<text x="24" y="1042" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">• After Import the result card replaces the preview and the button reads “Imported” until the tables change. Dishes are matched by name: existing ones updated, the rest created; recipe</text>
