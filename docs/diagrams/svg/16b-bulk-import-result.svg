<rect x="956" y="412" width="300" height="250" rx="6" fill="#ffffff" stroke="#9a9a9a" stroke-width="1"/>
<text x="974" y="442" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#222222">How matching works</text>
<line x1="956" y1="460" x2="1256" y2="460" stroke="#9a9a9a" stroke-width="1"/>
<text x="972" y="484" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#555555">A dish whose name matches an existing</text>
<text x="972" y="500.2" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#555555">product (ignoring capitals) updates it.</text>
<text x="972" y="516.4" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#555555">Any other name adds a new dish.</text>
<text x="972" y="538.6" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#555555">Every dish&#x27;s stock comes from its recipe,</text>
<text x="972" y="554.8000000000001" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#555555">so a new dish needs its rows in Recipes.</text>
<text x="972" y="571.0000000000001" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#555555">Recipe rows replace that dish&#x27;s whole</text>
<text x="972" y="587.2000000000002" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#555555">recipe.</text>
<text x="972" y="609.4000000000002" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#555555">Items in the Ready-made category are</text>
<text x="972" y="625.6000000000003" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#555555">counted in pieces, so they take no recipe.</text>
