<svg xmlns="http://www.w3.org/2000/svg" width="1328" height="984" viewBox="0 0 1328 984">
<rect x="0" y="0" width="1328" height="984" fill="#ffffff"/>
<text x="24" y="32" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#222222">24  Order status board (screen at the counter)</text>
<text x="24" y="54" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555">Route: /board   ·   Screen: 1280 × 720 screen at the counter (TV or monitor), landscape   ·   Access: Anyone (no login; kiosk or admin site)</text>
<text x="24" y="73" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555">Code: apps/web/src/app/board/page.tsx</text>
<text x="24" y="842" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#222222">Notes</text>
<text x="24" y="862" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">• The customer&#x27;s ready notice. Paid orders show under Preparing while the kitchen works on them (oldest first), then move to Ready for pickup when their last dish is done (newest first,</text>
<text x="24" y="881" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">   highlighted for 15 seconds, with a two-note chime). They leave when the kitchen presses Handed over (18).</text>
<text x="24" y="900" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">• No sign-in: GET /api/orders/board returns order numbers only, from the last 12 hours. It updates live (orders:changed), re-checks every minute, and shows “Reconnecting…” if the server</text>
<text x="24" y="919" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">   can&#x27;t be reached. Empty columns say “No orders being prepared.” / “Nothing waiting right now.”</text>
<text x="24" y="938" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">• Browsers play sound only after a tap, hence “Tap to turn on sound” (hidden once sound is on); a kiosk browser can be started with --autoplay-policy=no-user-gesture-required instead. Text</text>
<text x="24" y="957" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">   is larger on a TV-sized screen.</text>
