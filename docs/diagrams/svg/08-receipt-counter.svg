<text x="24" y="32" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#222222">08  Receipt: pay at counter</text>
<text x="24" y="54" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555">Route: /checkout  (after Place order)   ·   Screen: 1024 × 600 kiosk touchscreen, landscape   ·   Access: Customer (kiosk site, no login)</text>
<text x="24" y="73" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555">Code: apps/web/src/components/kiosk/ReceiptModal.tsx, apps/web/src/app/checkout/page.tsx, apps/web/src/lib/receiptPrinter.ts</text>
<text x="24" y="722" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#222222">Notes</text>
<text x="24" y="742" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">• On the in-store kiosk the receipt also prints on the 58 mm thermal printer, through the print service on the Raspberry Pi. The line above Done shows</text>
<text x="24" y="761" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">   “Printing your receipt…”, then “Take your printed receipt below.” (shown), or “We couldn&#x27;t print your receipt. Please show this screen at the</text>
<text x="24" y="780" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">   counter.” The order is placed either way. Phones opened from the QR code don&#x27;t print and show no line.</text>
<text x="24" y="799" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">• The order number is what the customer reads to the cashier (19). Dine in / Take out shows as the pill under the number.</text>
<text x="24" y="818" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">• If an online payment couldn&#x27;t start (online payment not set up, or too many attempts), the order is shown the same way as a counter order, with a</text>
<text x="24" y="837" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">   toast explaining it.</text>
<text x="24" y="856" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">• Done (or the idle reset) returns to the welcome screen (01). The order was already emptied when it was placed.</text>
