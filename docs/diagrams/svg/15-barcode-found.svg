<text x="24" y="54" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555">Route: /admin/barcode   ·   Screen: 1280 px wide desktop browser   ·   Access: Admin and Staff (admin site, signed in)</text>
<text x="24" y="73" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555">Code: apps/web/src/app/admin/barcode/page.tsx, apps/web/src/hooks/useBarcodeScanner.ts, apps/web/src/components/admin/AdminShell.tsx</text>
<text x="24" y="922" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#222222">Notes</text>
<text x="24" y="942" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">• A USB or Bluetooth scanner types the code and presses Enter; a scan is caught even when the field isn&#x27;t focused. After each lookup the field is cleared and focused for the next item.</text>
<text x="24" y="961" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">• Cost is shown to Admins only. Adjust stock opens 13b; a recipe dish shows “Servings left” and a Raw materials button instead. Stock updates live. “NOT ON THE KIOSK” appears if the</text>
<text x="24" y="980" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">   product has stock but is unavailable.</text>
<text x="24" y="999" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">• Input checks: empty → “Scan or type a barcode first.”; longer than 64 characters → asks to scan again.</text>
