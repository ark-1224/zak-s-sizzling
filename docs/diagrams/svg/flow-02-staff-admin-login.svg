<line x1="36" y1="1636" x2="36" y2="1662" stroke="#222222"/><line x1="68" y1="1636" x2="68" y2="1662" stroke="#222222"/>
<text x="82" y="1653" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555555">Shown in another diagram</text>
<rect x="263.76" y="1636" width="44" height="26" fill="#ffffff" stroke="#222222" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="315.76" y="1653" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555555">Partial in the code</text>
<text x="30" y="1700" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#222222">Notes</text>
<text x="30" y="1720" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555" xml:space="preserve">• Every API request is checked again on the server (authorize(&quot;admin&quot;) or authorize(&quot;admin&quot;, &quot;staff&quot;)), so the</text>
<text x="30" y="1737" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555" xml:space="preserve">   page checks only decide what is shown.</text>
<text x="30" y="1754" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555" xml:space="preserve">• The access token lasts 15 minutes and is renewed in the background with the 7-day refresh cookie. Each renewal</text>
<text x="30" y="1771" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555" xml:space="preserve">   re-reads the account, so a suspended or demoted user loses access at the next renewal. If renewal fails, the</text>
<text x="30" y="1788" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555" xml:space="preserve">   next request sends the user back to the login page.</text>
<text x="30" y="1805" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555" xml:space="preserve">• Log out clears the saved token and the refresh cookie and opens the login page.</text>
</svg>
