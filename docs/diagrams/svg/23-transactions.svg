<text x="24" y="54" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555">Route: /admin/transactions   ·   Screen: 1280 px wide desktop browser   ·   Access: Admin only (admin site, signed in)</text>
<text x="24" y="73" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555">Code: apps/web/src/app/admin/transactions/page.tsx, apps/web/src/components/admin/AdminShell.tsx</text>
<text x="24" y="1122" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#222222">Notes</text>
<text x="24" y="1142" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">• Admin only. GET /api/orders/history: the orders in the date range (Manila days, today by default), newest first, 25 a page (Previous / Next with “Page 1 of N”). Filters: status (Unpaid,</text>
<text x="24" y="1161" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">   Confirmed, Preparing, Ready, Handed over, Cancelled), payment method, paid or unpaid, and order number (ignores spaces and dashes).</text>
<text x="24" y="1180" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">• The totals cover every matching order: how many, sales from the paid ones (confirmed to handed over, as in Analytics) and their average order value. Clicking a row opens its items,</text>
<text x="24" y="1199" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">   instructions, timeline (placed, paid, preparing, ready, handed over or cancelled) and the PayMongo reference for QR Ph.</text>
<text x="24" y="1218" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">• Reloads by itself when an order changes (orders:changed). Empty: “No orders match these filters.”</text>
