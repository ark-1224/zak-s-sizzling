<text x="30" y="1705" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555" xml:space="preserve">• Staff cancel paid orders on Orders awaiting payment › Paid orders (19f); the kitchen display no longer has</text>
<text x="30" y="1722" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555" xml:space="preserve">   Cancel order (panel feedback). Any signed-in Staff or Admin can do it, until the kitchen presses Handed over.</text>
<text x="30" y="1739" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555" xml:space="preserve">• Dishes still not started go back into stock, logged as a customer return under the person who cancelled; a dish</text>
<text x="30" y="1756" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555" xml:space="preserve">   started or done counts as used. The returns show in Stock movements (14g).</text>
<text x="30" y="1773" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555" xml:space="preserve">• The system can&#x27;t send money back, so the refund happens outside it (cash from the drawer, or GCash / Maya back</text>
<text x="30" y="1790" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555" xml:space="preserve">   to the customer), and staff record it. A late or repeated online payment event can&#x27;t undo a refund.</text>
