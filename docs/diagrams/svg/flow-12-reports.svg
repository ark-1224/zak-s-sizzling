<text x="30" y="1466" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555" xml:space="preserve">• Sales and order counts cover the last 14 days (daily), 8 weeks (weekly) or 6 months (monthly). Top products,</text>
