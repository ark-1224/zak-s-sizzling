<text x="24" y="32" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#222222">07  Review &amp; pay (checkout)</text>
<text x="24" y="54" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555">Route: /checkout   ·   Screen: 1024 × 600 kiosk touchscreen, landscape   ·   Access: Customer (kiosk site, no login)</text>
<text x="24" y="73" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555">Code: apps/web/src/app/checkout/page.tsx</text>
<text x="24" y="722" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#222222">Notes</text>
<text x="24" y="742" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">• Left: the order with special instructions, Edit (back to the menu), and the estimated preparation time (only when POST /api/orders/estimate</text>
<text x="24" y="761" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">   answers).</text>
<text x="24" y="780" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">• Right: payment method, total and Place order. Dine in / take out isn&#x27;t asked here: it was chosen on 02 and goes with the order. Below 1024 px wide</text>
<text x="24" y="799" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">   the right side drops under the order and Place order sits in a bar at the bottom.</text>
<text x="24" y="818" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">• QR Ph is the one online method (scan with any bank or e-wallet app, through PayMongo). It stays greyed out (“Not set up yet”) until online payment</text>
<text x="24" y="837" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">   is set up (GET /api/payments/options); once set up it reads “Scan with any bank or e-wallet app”. PARTIAL: not yet tested with PayMongo.</text>
<text x="24" y="856" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">• Place order sends the order; Pay at counter then shows the receipt (08). QR Ph opens PayMongo&#x27;s payment page instead, showing the QR code. An error</text>
<text x="24" y="875" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">   (e.g. a dish sold out) appears as a toast message.</text>
