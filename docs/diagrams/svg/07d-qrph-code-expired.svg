<text x="444" y="178" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" text-anchor="start" fill="#222222">₱000.00</text>
<text x="444" y="222" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#222222">1. Open your bank or e-wallet app (GCash, Maya or any</text>
<text x="444" y="243.6" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#222222">bank).</text>
<text x="444" y="268" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#222222">2. Scan this QR code and confirm the payment.</text>
<text x="444" y="314" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#222222">3. Stay here: your receipt appears once the payment is</text>
<text x="444" y="335.6" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#222222">received.</text>
