<text x="24" y="32" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#222222">19f  Orders awaiting payment: Paid orders (cancelling some dishes)</text>
<text x="24" y="54" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555">Route: /staff/orders?tab=paid   ·   Screen: 1280 px wide desktop browser   ·   Access: Admin and Staff (admin site, signed in)</text>
<text x="24" y="73" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555">Code: apps/web/src/components/staff/PaidOrders.tsx, apps/web/src/components/staff/CancelDishes.tsx, apps/web/src/app/staff/orders/page.tsx, apps/web/src/components/admin/AdminShell.tsx</text>
<text x="24" y="1082" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#222222">Notes</text>
<text x="24" y="1102" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">• Paid orders not yet handed over (GET /api/orders?inKitchen=1), oldest first, each dish with its kitchen progress (not started, cooking, done), the order&#x27;s status and how it was paid;</text>
<text x="24" y="1121" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">   updates live as the kitchen works. Receipt shows the receipt again (19d, 19g).</text>
<text x="24" y="1140" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">• Cancel order (moved here from the kitchen display, per the panel) asks which dishes, all ticked at first, and how many of each (− / +), and a reason, a quick choice or typed (the button</text>
<text x="24" y="1159" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">   stays disabled until there is one); POST /api/orders/:id/cancel-items. Dishes chosen that the kitchen hasn&#x27;t started go back into stock, logged under the person who cancelled with the</text>
<text x="24" y="1178" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">   reason “return”; a started or done dish counts as used.</text>
<text x="24" y="1197" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">• Some dishes: the rest stays on the kitchen display (a dish cancelled whole leaves it; the order is ready once every dish left is done), the total goes down, and the Queue shows NEEDS</text>
<text x="24" y="1216" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">   ATTENTION with a note to refund their amount; Mark as sorted out keeps the payment as paid. Every dish left: the whole order is cancelled, as before, and Refunded: mark as sorted out</text>
<text x="24" y="1235" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">   records the payment as refunded (19). Reasons and refunds show in Transactions (23).</text>
