<text x="24" y="32" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#222222">19f  Orders awaiting payment: Paid orders (cancelling one)</text>
<text x="24" y="54" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555">Route: /staff/orders?tab=paid   ·   Screen: 1280 px wide desktop browser   ·   Access: Admin and Staff (admin site, signed in)</text>
<text x="24" y="73" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555">Code: apps/web/src/components/staff/PaidOrders.tsx, apps/web/src/app/staff/orders/page.tsx, apps/web/src/components/admin/AdminShell.tsx</text>
<text x="24" y="1022" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#222222">Notes</text>
<text x="24" y="1042" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">• Paid orders not yet handed over (GET /api/orders?inKitchen=1), oldest first, each dish with its kitchen progress (not started, cooking, done), the order&#x27;s status and how it was paid;</text>
<text x="24" y="1061" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">   updates live as the kitchen works. Receipt shows the receipt again (19d).</text>
<text x="24" y="1080" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">• Cancel order (moved here from the kitchen display, per the panel) asks for a reason, a quick choice or typed (Yes, cancel order stays disabled until there is one); POST</text>
<text x="24" y="1099" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">   /api/kitchen/orders/:id/cancel. Dishes still not started go back into stock, logged under the person who cancelled with the reason “return”; a dish started or done counts as used.</text>
<text x="24" y="1118" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">• The system can&#x27;t send money back, so the order moves to the Queue as NEEDS ATTENTION with a note to refund the customer (how it was paid included), until staff press Refunded: mark as</text>
<text x="24" y="1137" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">   sorted out (19). The reason and refund time show in Transactions (23).</text>
