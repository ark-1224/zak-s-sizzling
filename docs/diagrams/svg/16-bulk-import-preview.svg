<text x="972" y="420" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#555555">A row with a barcode that matches an</text>
<text x="972" y="436.2" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#555555">existing product updates it. A row with no</text>
<text x="972" y="452.4" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#555555">barcode, or a barcode that doesn&#x27;t match</text>
