<text x="24" y="32" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#222222">16  Bulk import: preview with an error</text>
<text x="24" y="54" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555">Route: /admin/import   ·   Screen: 1280 px wide desktop browser   ·   Access: Admin only (admin site, signed in)</text>
<text x="24" y="73" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555">Code: apps/web/src/app/admin/import/page.tsx, apps/web/src/components/admin/AdminShell.tsx</text>
<text x="24" y="1002" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#222222">Notes</text>
<text x="24" y="1022" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">• Load a .csv or .xlsx by Browse or drag-and-drop, or paste CSV. An .xlsx file is converted to CSV by the server and shown in the box, where rows can be edited; the card then says which</text>
<text x="24" y="1041" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">   sheet was read.</text>
<text x="24" y="1060" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">• Half a second after any change the server checks every row without saving (a dry run) and fills the Preview. Import stays disabled while checking (“Checking rows…”) and until no row has</text>
<text x="24" y="1079" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">   an error.</text>
<text x="24" y="1098" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">• File checks: an old .xls is refused with instructions; an .xlsx over 2 MB is refused. Template download failures show their reason under the links.</text>
