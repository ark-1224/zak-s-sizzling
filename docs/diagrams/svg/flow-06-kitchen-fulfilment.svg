<text x="30" y="1965" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555" xml:space="preserve">• Any signed-in Staff or Admin can use the kitchen display. A dish only moves forward: Pending → In Progress →</text>
