<text x="315.76" y="2086" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555555">Partial in the code</text>
<text x="30" y="2133" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#222222">Notes</text>
<text x="30" y="2153" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555" xml:space="preserve">• PARTIAL: finishing every dish doesn&#x27;t change the order&#x27;s own status (the database has preparing, ready and</text>
<text x="30" y="2170" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555" xml:space="preserve">   completed, but the code never sets them), and nothing in the system tells the customer the order is ready; the</text>
<text x="30" y="2187" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555" xml:space="preserve">   receipt says “We&#x27;ll call your order number”.</text>
<text x="30" y="2204" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555" xml:space="preserve">• Any signed-in Staff or Admin can use the kitchen display. A dish only moves forward: Pending → In Progress →</text>
<text x="30" y="2221" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555" xml:space="preserve">   Completed.</text>
<text x="30" y="2238" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555" xml:space="preserve">• Kitchen tickets print only on the device with the kitchen printer (print-service/), once per order; if printing</text>
<text x="30" y="2255" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555" xml:space="preserve">   fails the display says so and tries again with the next update or within 30 seconds.</text>
</svg>
