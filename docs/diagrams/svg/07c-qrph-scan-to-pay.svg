<svg xmlns="http://www.w3.org/2000/svg" width="1072" height="902" viewBox="0 0 1072 902">
<rect x="0" y="0" width="1072" height="902" fill="#ffffff"/>
<text x="24" y="32" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#222222">07c  QR Ph: scan to pay</text>
<text x="24" y="54" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555">Route: /checkout  (after Place order with QR Ph)   ·   Screen: 1024 × 600 kiosk touchscreen, landscape   ·   Access: Customer (kiosk site, no login)</text>
<text x="24" y="73" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555">Code: apps/web/src/components/kiosk/QrPaymentScreen.tsx, apps/web/src/app/checkout/page.tsx, apps/api/src/modules/payments/service.ts, apps/api/src/lib/paymongo.ts</text>
<text x="24" y="722" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#222222">Notes</text>
<text x="24" y="742" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">• Shown after Place order with QR Ph: the QR Ph code from PayMongo appears on the kiosk itself (no hand-off to PayMongo&#x27;s page). The customer scans it</text>
<text x="24" y="761" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">   with any bank or e-wallet app.</text>
<text x="24" y="780" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">• Every 3 s the kiosk asks the API whether the payment has arrived (GET /api/payments/qrph/:orderId, which also asks PayMongo); once paid it shows</text>
<text x="24" y="799" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">   “Payment received!” (08b) and, on the in-store kiosk, prints the receipt. The code expires after 10 minutes (07d). The idle reset is paused while</text>
<text x="24" y="818" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">   the code can be scanned.</text>
<text x="24" y="837" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">• “Pay at the counter instead” turns it into an ordinary counter order and shows the counter receipt (08). The test-mode link appears only with</text>
<text x="24" y="856" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">   PayMongo test keys. On a phone a “Save QR image” button is added, since a phone can&#x27;t scan its own screen.</text>
<text x="24" y="875" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">• PARTIAL: not yet tested with PayMongo keys. If no code can be made, the order finishes as a counter order with a message.</text>
<g transform="translate(24,92)"><clipPath id="frame"><rect x="0" y="0" width="1024" height="600"/></clipPath><g clip-path="url(#frame)"><rect x="0" y="0" width="1024" height="600" fill="#ffffff"/>
<rect x="0" y="0" width="1024" height="600" rx="0" fill="#f3f3f3" stroke="none"/>
<rect x="0" y="0" width="1024" height="60" rx="0" fill="#c9c9c9" stroke="none"/>
<line x1="0" y1="60" x2="1024" y2="60" stroke="#555555" stroke-width="2"/>
<circle cx="32" cy="30" r="11" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/>
<text x="56" y="38" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#222222">Scan to pay</text>
<text x="1000" y="37" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" text-anchor="end" fill="#555555">Order ZK-XXXXXX</text>
<rect x="32" y="140" width="372" height="372" rx="28" fill="#ffffff" stroke="#9a9a9a" stroke-width="1"/>
<rect x="70" y="178" width="296" height="296" rx="0" fill="#e2e2e2" stroke="#9a9a9a" stroke-width="1"/>
<line x1="70" y1="178" x2="366" y2="474" stroke="#c9c9c9" stroke-width="1"/>
<line x1="366" y1="178" x2="70" y2="474" stroke="#c9c9c9" stroke-width="1"/>
<rect x="125.11999999999999" y="313.0" width="185.76000000000002" height="22.099999999999998" rx="3" fill="#ffffff" stroke="none" stroke-width="1"/>
<text x="218.0" y="330.55" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#555555">QR Ph code (from PayMongo)</text>
<text x="444" y="130" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#555555">Amount to pay</text>
<text x="444" y="178" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" text-anchor="start" fill="#222222">₱000.00</text>
<text x="444" y="222" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#222222">1. Open your bank or e-wallet app (GCash, Maya or any</text>
<text x="444" y="243.6" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#222222">bank).</text>
<text x="444" y="268" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#222222">2. Scan this QR code and confirm the payment.</text>
<text x="444" y="314" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#222222">3. Stay here: your receipt appears once the payment is</text>
<text x="444" y="335.6" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#222222">received.</text>
<rect x="444" y="360" width="446" height="46" rx="14" fill="#e2e2e2" stroke="none"/>
<circle cx="464" cy="383" r="6" fill="#555555" stroke="#555555" stroke-width="1"/>
<text x="480" y="388" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#222222">Waiting for your payment… code expires in 9:56</text>
<rect x="444" y="426" width="446" height="54" rx="27" fill="#ffffff" stroke="#9a9a9a" stroke-width="1"/>
<text x="667.0" y="459.12" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#555555">Pay at the counter instead</text>
<text x="444" y="508" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#555555">PayMongo test mode: simulate this payment</text>
</g><rect x="0" y="0" width="1024" height="600" fill="none" stroke="#222222" stroke-width="2"/></g>
</svg>
