<text x="24" y="54" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555">Route: /staff/orders  (popup)   ·   Screen: 1280 px wide desktop browser   ·   Access: Admin and Staff (admin site, signed in)</text>
<text x="24" y="73" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555">Code: apps/web/src/components/staff/PaymentPanel.tsx, apps/web/src/app/staff/orders/page.tsx, apps/web/src/components/admin/AdminShell.tsx</text>
<text x="24" y="1022" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#222222">Notes</text>
<text x="24" y="1042" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">• Cash: Cash received (typed, or a quick amount: Exact and the next round amounts), with the change worked out; an amount short of the total says “₱… short” and can&#x27;t be confirmed. The</text>
<text x="24" y="1061" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">   cash received is saved for the receipt.</text>
<text x="24" y="1080" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">• GCash or Maya: paid to the shop&#x27;s own account; the field becomes “GCash reference number”, from the customer&#x27;s payment confirmation (“Check that ₱… reached the shop&#x27;s GCash account</text>
<text x="24" y="1099" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">   before confirming”). A reference number can be recorded once (409 names the order that has it). No PayMongo is involved.</text>
<text x="24" y="1118" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">• Confirm checks the stock first (“Checking stock…”): if something has run out, nothing is saved and the panel says to hand the money back and change the order with the customer. Not now</text>
<text x="24" y="1137" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">   closes it; the order waits in the Queue unpaid.</text>
