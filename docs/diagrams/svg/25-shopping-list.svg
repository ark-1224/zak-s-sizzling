<text x="24" y="32" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#222222">25  Market purchases: Shopping list</text>
<text x="24" y="54" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555">Route: /admin/purchases   ·   Screen: 1280 px wide desktop browser   ·   Access: Admin only (admin site, signed in)</text>
<text x="24" y="73" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#555555">Code: apps/web/src/app/admin/purchases/page.tsx, apps/web/src/components/admin/purchasing/PurchasingViews.tsx, apps/api/src/modules/purchasing/shoppingList.ts, apps/web/src/components/admin/AdminShell.tsx</text>
<text x="24" y="1022" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#222222">Notes</text>
<text x="24" y="1042" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">• Before each market trip (the owner goes about every two weeks): GET /api/purchases/shopping-list?days=14. Days until the next trip is remembered on the device. Items whose stock covers</text>
<text x="24" y="1061" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">   the trip aren&#x27;t listed; an item with no price yet is left out of the total.</text>
<text x="24" y="1080" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">• An item that won&#x27;t stay fresh until the next trip (not frozen) is bought only for its fresh days, with a reminder to plan a top-up. Print list prints the page; Record the trip from this</text>
<text x="24" y="1099" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#555555" xml:space="preserve">   list opens the purchase form (25b) with each line&#x27;s planned amount filled in.</text>
